{% extends "layout.html" %}
{% block content %}
<style>
    /* 🎬 STYLE ĐỒNG BỘ VỚI LOGIN */
    .glass-card {
        background: rgba(20, 20, 30, 0.6) !important;
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 20px !important;
    }
    .glow-input {
        background-color: rgba(0, 0, 0, 0.3) !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        color: #fff !important;
        padding: 12px 16px;
        border-radius: 10px 0 0 10px !important; /* Bo góc trái */
    }
    .glow-input:focus {
        border-color: #ff416c !important;
        box-shadow: 0 0 8px rgba(255, 65, 108, 0.3) !important;
    }
    .glow-input-btn {
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        border-left: none !important;
        background-color: rgba(0, 0, 0, 0.3) !important;
        color: #77758f !important;
        border-radius: 0 10px 10px 0 !important; /* Bo góc phải */
    }
    .glow-input-btn:hover { color: #ff416c !important; border-color: #ff416c !important; }
    .btn-gradient {
        background: linear-gradient(45deg, #ff416c, #ff4b2b);
        border: none !important; color: white !important;
        padding: 12px; border-radius: 10px !important;
    }
</style>

<div class="d-flex align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="card glass-card p-4 w-100 shadow" style="max-width:400px;">
        <h4 class="text-white text-center mb-3">Đặt mật khẩu mới</h4>
        
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="mb-3">
                <div class="input-group">
                    <input id="password" class="form-control glow-input" type="password" 
                           name="password" placeholder="Mật khẩu mới..." required>
                    <button type="button" class="btn glow-input-btn" onclick="togglePassword('password', 'eye-icon1')">
                        <i id="eye-icon1" class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <div class="input-group">
                    <input id="confirm_password" class="form-control glow-input" type="password" 
                           name="confirm_password" placeholder="Xác nhận mật khẩu..." required>
                    <button type="button" class="btn glow-input-btn" onclick="togglePassword('confirm_password', 'eye-icon2')">
                        <i id="eye-icon2" class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="small text-secondary mb-3">
                <p class="mb-1">Mật khẩu cần có:</p>
                <ul class="text-muted">
                    <li>Ít nhất 8 ký tự</li>
                    <li>Chứa chữ hoa, chữ thường, số</li>
                    <li>Chứa ký tự đặc biệt (!@#$%^&*)</li>
                </ul>
            </div>
            
            <button type="submit" class="btn btn-gradient w-100">Cập nhật mật khẩu</button>
        </form>

        {% if error %}
        <div class="alert alert-danger bg-danger bg-opacity-10 border-danger border-opacity-25 text-center py-2 mt-3 text-danger small rounded-3">
            ⚠️ {{ error }}
        </div>
        {% endif %}
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("bi-eye", "bi-eye-slash");
    } else {
        input.type = "password";
        icon.classList.replace("bi-eye-slash", "bi-eye");
    }
}
</script>
{% endblock %}

{% extends "layout.html" %}
{% block content %}
<style>
    /* 🎬 STYLE ĐỒNG BỘ */
    .glass-card {
        background: rgba(20, 20, 30, 0.6) !important;
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 20px !important;
    }
    .glow-input {
        background-color: rgba(0, 0, 0, 0.3) !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        color: #fff !important;
        padding: 12px 16px;
        border-radius: 10px !important;
    }
    .glow-input:focus {
        border-color: #ff416c !important;
        box-shadow: 0 0 8px rgba(255, 65, 108, 0.3) !important;
    }
    .btn-gradient {
        background: linear-gradient(45deg, #ff416c, #ff4b2b);
        border: none !important; color: white !important;
        padding: 12px; border-radius: 10px !important;
        transition: 0.3s;
    }
    .btn-gradient:hover { filter: brightness(1.2); }
</style>

<div class="d-flex align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="card glass-card p-4 w-100 shadow" style="max-width:400px;">
        <h4 class="text-white text-center mb-4 fw-bold">Quên mật khẩu</h4>
        
        <p class="text-secondary text-center small mb-4">
            Nhập email của bạn để thực hiện đặt lại mật khẩu.
        </p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="mb-3">
                <input type="email" name="email" class="form-control glow-input" 
                       placeholder="Nhập email của bạn..." required>
            </div>
            
            <button type="submit" class="btn btn-gradient w-100">
                <i class="bi bi-send me-2"></i> Gửi Yêu Cầu
            </button>
        </form>

        {% if error %}
        <div class="alert alert-danger bg-danger bg-opacity-10 border-danger border-opacity-25 text-center py-2 mt-3 text-danger small rounded-3">
            <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success bg-success bg-opacity-10 border-success border-opacity-25 text-center py-2 mt-3 text-success small rounded-3">
            <i class="bi bi-check-circle-fill"></i> {{ success }}
        </div>
        {% endif %}

        <div class="text-center mt-4">
            <a href="{{ url_for('login') }}" class="text-white text-decoration-none small fw-bold">
                <i class="bi bi-arrow-left me-1"></i> Quay lại đăng nhập
            </a>
        </div>
    </div>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieBooking- Đặt Vé Xem Phim Chuẩn IMAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #0b0b12 !important; color: #e2e2e9 !important; font-family: 'Segoe UI', sans-serif; }
        .premium-navbar { background: rgba(15, 15, 24, 0.75) !important; backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.06); padding: 15px 0; }
        .navbar-brand-cinema { font-weight: 900; letter-spacing: 1px; background: linear-gradient(45deg, #ff416c, #ff4b2b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>

    <nav class="navbar premium-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand navbar-brand-cinema fs-4" href="{{ url_for('home') }}">
                <i class="bi bi-film me-2"></i>MOVIE
            </a>
            </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

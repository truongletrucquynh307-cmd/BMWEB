{% extends "layout.html" %}

{% block content %}
<div class="container py-4 text-white" style="max-width: 800px;">
    
    <div class="d-flex align-items-center mb-4">
        <a href="{{ url_for('admin_showtimes') }}" class="btn btn-outline-secondary btn-sm me-3">
            <i class="bi bi-arrow-left"></i> Quay lại
        </a>
        <h2 class="mb-0">Chỉnh sửa suất chiếu</h2>
    </div>

    <form method="POST" class="bg-dark p-4 rounded shadow">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
            <label class="form-label">Phim</label>
            <select name="movie_id" class="form-select bg-secondary text-white border-0">
                {% for m in movies %}
                <option value="{{ m.id }}" {% if m.id == showtime.movie_id %}selected{% endif %}>
                    {{ m.title }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Rạp</label>
            <input type="text" name="cinema" class="form-control bg-secondary text-white border-0" value="{{ showtime.cinema }}">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Phòng chiếu</label>
                <select name="hall" class="form-select bg-secondary text-white border-0">
                    {% for hall in ['Phòng 01', 'Phòng 02', 'Phòng 03', 'Phòng 04', 'IMAX'] %}
                    <option {% if showtime.hall == hall %}selected{% endif %}>{{ hall }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Ngày chiếu</label>
                <input type="date" name="date" class="form-control bg-secondary text-white border-0" value="{{ showtime.date }}">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Giờ chiếu</label>
                <input type="time" name="time" class="form-control bg-secondary text-white border-0" value="{{ showtime.time }}">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Giá vé</label>
            <input type="number" name="price" class="form-control bg-secondary text-white border-0" value="{{ showtime.price }}">
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('admin_showtimes') }}" class="btn btn-outline-secondary px-4">Hủy</a>
            <button type="submit" class="btn btn-outline-warning px-4">
                <i class="bi bi-check-circle"></i> Lưu thay đổi
            </button>
        </div>
    </form>
</div>
{% endblock %}

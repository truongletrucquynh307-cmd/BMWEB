{% extends "layout.html" %}

{% block content %}
<div class="container py-4 text-white" style="max-width: 800px;">
    
    <div class="d-flex align-items-center mb-4">
        <a href="{{ url_for('admin_showtimes') }}" class="btn btn-outline-secondary btn-sm me-3">
            <i class="bi bi-arrow-left"></i> Quay lại
        </a>
        <h2 class="mb-0">Thêm Suất Chiếu Mới</h2>
    </div>

    <form method="POST" class="bg-dark p-4 rounded shadow">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
            <label class="form-label text-light">Phim</label>
            <select name="movie_id" class="form-select bg-secondary text-white border-0" required>
                <option value="" disabled selected>Chọn phim cần tạo suất chiếu...</option>
                {% for m in movies %}
                <option value="{{ m.id }}">
                    {{ m.title }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label text-light">Rạp chiếu</label>
            <select name="cinema" class="form-select bg-secondary text-white border-0" required>
                <option value="CGV Vincom">CGV Vincom</option>
                <option value="CGV Landmark 81">CGV Landmark 81</option>
                <option value="CGV Aeon Mall">CGV Aeon Mall</option>
                <option value="Lotte Cinema Gò Vấp">Lotte Cinema Gò Vấp</option>
                <option value="Galaxy Nguyễn Du">Galaxy Nguyễn Du</option>
            </select>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label text-light">Phòng chiếu</label>
                <select name="hall" class="form-select bg-secondary text-white border-0">
                    <option>Phòng 01</option>
                    <option>Phòng 02</option>
                    <option>Phòng 03</option>
                    <option>Phòng 04</option>
                    <option>IMAX</option>
                </select>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label text-light">Ngày chiếu</label>
                <input type="date" name="date" class="form-control bg-secondary text-white border-0" required>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label text-light">Giờ chiếu</label>
                <input type="time" name="time" class="form-control bg-secondary text-white border-0" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-light">Giá vé (VND)</label>
            <input type="number" name="price" class="form-control bg-secondary text-white border-0" 
                   value="90000" required>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('admin_showtimes') }}" class="btn btn-outline-secondary px-4">Hủy</a>
            <button type="submit" class="btn btn-outline-success px-4">
                <i class="bi bi-plus-lg"></i> Thêm suất chiếu
            </button>
        </div>
    </form>
</div>
{% endblock %}

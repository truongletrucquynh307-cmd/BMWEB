{% extends "layout.html" %}

{% block content %}
<div class="container py-4 text-white" style="max-width: 800px;">
    
    <div class="d-flex align-items-center mb-4">
        <a href="{{ url_for('admin_movies') }}" class="btn btn-outline-secondary btn-sm me-3">
            <i class="bi bi-arrow-left"></i> Quay lại
        </a>
        <h2 class="mb-0">Thêm Phim Mới</h2>
    </div>

    <form method="POST" enctype="multipart/form-data" class="bg-dark p-4 rounded shadow">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
            <label class="form-label">Tên phim</label>
            <input type="text" name="title" class="form-control bg-secondary text-white border-0" required placeholder="Nhập tên phim...">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Thể loại</label>
                <input type="text" name="genre" class="form-control bg-secondary text-white border-0" placeholder="Ví dụ: Action, Sci-Fi">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Thời lượng (phút)</label>
                <input type="number" name="duration" class="form-control bg-secondary text-white border-0">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Đánh giá (Rating)</label>
                <input type="number" step="0.1" name="rating" class="form-control bg-secondary text-white border-0" placeholder="0.0">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Poster phim</label>
            <input type="file" name="poster" class="form-control bg-secondary text-white border-0">
            <small class="text-muted">Định dạng hỗ trợ: JPG, PNG</small>
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-outline-success px-4">
                <i class="bi bi-save"></i> Lưu phim
            </button>
        </div>
    </form>
</div>
{% endblock %}

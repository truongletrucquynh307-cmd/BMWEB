{% extends "layout.html" %}

{% block content %}
<style>
    /* Định nghĩa lại các nút outline để đồng bộ UI */
    .btn-outline-warning {
        border-color: #ffc107;
        color: #ffc107;
    }
    .btn-outline-warning:hover {
        background-color: #ffc107;
        color: #000;
    }

    .btn-outline-danger {
        border-color: #dc3545;
        color: #dc3545;
    }
    .btn-outline-danger:hover {
        background-color: #dc3545;
        color: #fff;
    }

    /* Tạo khoảng cách đồng bộ cho tất cả các nút */
    .btn-sm {
        padding: 0.25rem 0.6rem;
        font-size: 0.8rem;
        border-radius: 6px;
    }
    .btn-outline-success {
        border-color: #198754;
        color: #198754;
    }
    .btn-outline-success:hover {
        background-color: #198754;
        color: #fff;
    }
    /* Ép tất cả các hàng có chiều cao cố định hoặc tối thiểu */
    .table tbody tr {
        height: 100px; /* Bạn có thể điều chỉnh con số này */
    }

    /* Căn giữa tất cả nội dung trong ô theo chiều dọc */
    .table td {
        vertical-align: middle !important;
    }

    /* Cố định kích thước ảnh poster để không làm vỡ layout */
    .table img {
        width: 60px;
        height: 85px; /* Giữ tỷ lệ cố định */
        object-fit: cover; /* Giúp ảnh không bị méo */
        border-radius: 4px;
    }
</style>
<div class="container py-5 text-white">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center">
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary btn-sm me-3">
                <i class="bi bi-arrow-left"></i> Quay lại
            </a>
            <h2 class="mb-0"> <i class="bi bi-film me-2"></i>Quản lý phim</h2>
        </div>

       <a href="{{ url_for('admin_add_movie') }}"
        class="btn btn-outline-success px-4"> 
            <i class="bi bi-plus-circle"></i> Thêm phim
        </a>
    </div>

    <div class="table-responsive">

        <table class="table table-dark table-hover align-middle">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Poster</th>
                    <th>Tên phim</th>
                    <th>Thể loại</th>
                    <th>Thời lượng</th>
                    <th>Rating</th>
                    <th width="180">Thao tác</th>
                </tr>
            </thead>

            <tbody>

                {% for m in movies %}
                <tr>

                    <td>{{ m.id }}</td>

                    <td>
                        <img src="{{ url_for('static', filename='posters/' ~ m.poster) }}"
                             width="70"
                             class="rounded">
                    </td>

                    <td>{{ m.title }}</td>

                    <td>{{ m.genre }}</td>

                    <td>{{ m.duration }} phút</td>

                    <td>{{ m.rating }}</td>

                    <td>
                        <a href="{{ url_for('admin_edit_movie', movie_id=m.id) }}"
                        class="btn btn-outline-warning btn-sm me-2"> Sửa
                        </a>

                        <a href="{{ url_for('admin_delete_movie', movie_id=m.id) }}"
                        class="btn btn-outline-danger btn-sm"
                        onclick="return confirm('Xóa phim này?')">
                            Xóa
                        </a>
                    </td>

                </tr>
                {% endfor %}

            </tbody>

        </table>

    </div>

</div>
{% endblock %}

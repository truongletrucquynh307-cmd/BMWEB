{% extends "layout.html" %}

{% block content %}
<div class="container py-4 text-white" style="max-width: 800px;">
    
    <div class="d-flex align-items-center mb-4">
        <a href="{{ url_for('admin_movies') }}" class="btn btn-outline-secondary btn-sm me-3">
            <i class="bi bi-arrow-left"></i> Quay lại
        </a>
        <h2 class="mb-0">Chỉnh sửa: {{ movie.title }}</h2>
    </div>

    <form method="POST" enctype="multipart/form-data" class="bg-dark p-4 rounded shadow">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
            <label class="form-label">Tên phim</label>
            <input type="text" name="title" class="form-control bg-secondary text-white border-0" value="{{ movie.title }}" required>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Thể loại</label>
                <input type="text" name="genre" class="form-control bg-secondary text-white border-0" value="{{ movie.genre }}" required>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Thời lượng (phút)</label>
                <input type="number" name="duration" class="form-control bg-secondary text-white border-0" value="{{ movie.duration }}" required>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Đánh giá (Rating)</label>
                <input type="number" step="0.1" name="rating" class="form-control bg-secondary text-white border-0" value="{{ movie.rating }}" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Poster phim</label>
            <input type="file" name="poster" class="form-control bg-secondary text-white border-0">
            <small class="text-muted">Ảnh hiện tại: <strong>{{ movie.poster }}</strong>. Chọn file mới nếu muốn đổi.</small>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('admin_movies') }}" class="btn btn-outline-secondary px-4">Hủy</a>
            <button type="submit" class="btn btn-outline-warning px-4">
                <i class="bi bi-check-circle"></i> Lưu thay đổi
            </button>
        </div>
    </form>
</div>
{% endblock %}

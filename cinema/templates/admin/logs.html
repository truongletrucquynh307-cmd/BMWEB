{% extends "layout.html" %}

{% block content %}
<div class="container py-5 text-white">

    <div class="d-flex align-items-center mb-4">
        
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary btn-sm me-3">
            <i class="bi bi-arrow-left"></i> Quay lại
        </a>

        <h2 class="fw-bold mb-0">
            <i class="bi bi-clock-history"></i>
            Nhật ký hệ thống
        </h2>
    </div>

    <div class="table-responsive">
        <table class="table table-dark table-hover align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>User</th>
                    <th>Hành động</th>
                    <th>Thời gian</th>
                </tr>
            </thead>
            <tbody>
                {% for log in logs %}
                <tr>
                    <td>{{ log.id }}</td>
                    <td>{{ log.email or 'Unknown' }}</td>
                    <td>{{ log.action }}</td>
                    <td>{{ log.formatted_time }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
